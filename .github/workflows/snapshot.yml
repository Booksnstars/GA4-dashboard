name: Generate GA4 Snapshot

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily (08:00 BST / 07:00 GMT)
  workflow_dispatch:       # manual trigger from GitHub Actions tab

permissions:
  contents: write          # needed to commit the snapshot back to the repo

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ga4_dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r ga4_dashboard/requirements.txt

      - name: Generate snapshot
        env:
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
        run: python generate_snapshot.py

      # Commits the generated HTML to the snapshot/ folder on master so it can
      # be downloaded from GitHub at any time. Switch to deploy-pages when a
      # Sage org admin enables GitHub Pages for this repo.
      - name: Commit snapshot to repo
        run: |
          mkdir -p snapshot
          cp output/index.html snapshot/index.html
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshot/index.html
          git diff --cached --quiet && echo "No changes." || \
            git commit -m "chore: update snapshot $(date -u +%Y-%m-%d)" && \
            git push
